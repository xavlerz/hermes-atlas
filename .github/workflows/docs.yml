name: Documentation validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run documentation tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/docs/tests -v
      - name: Validate Atlas documentation
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/docs/validate_atlas.py
